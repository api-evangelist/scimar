  abilities_status: 401
  abilities_namespace_index: https://scimar.ca/wp-json/wp-abilities/v1
  abilities_namespace_index_status: 200
  abilities_routes:
  - /wp-abilities/v1/abilities
  - /wp-abilities/v1/abilities/{name}
  - /wp-abilities/v1/abilities/{name}/run
  - /wp-abilities/v1/categories
  - /wp-abilities/v1/categories/{slug}
  note: >-
    The WordPress Abilities API registry is what the MCP Adapter projects as tools. Its namespace index
    is public but the abilities listing itself returns 401 rest_forbidden, so the tool set is gated the
    same way the MCP endpoints are.
tools: []
tools_note: >-
  NOT AN EMPTY TOOL SET — the tool set is unknown. tools/list is authentication-gated on both endpoints,
  the wp-abilities registry is gated, and the published llms.txt is a page/post link index with no tool
  list, so there is no public source for tool names or input schemas. Nothing here is derived or guessed.
  Authenticated introspection would be required to enumerate them.

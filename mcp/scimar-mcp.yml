method: probed
status: published
source: https://scimar.ca/wp-json/mcp
summary: >-
  scimar.ca runs the WordPress MCP Adapter. The "mcp" namespace is registered in the site's WordPress
  REST route index alongside wp-abilities/v1 (the adapter's backing ability registry) and exposes TWO
  Model Context Protocol server endpoints. Both are live and both are authentication-gated, so the
  published tool set could not be enumerated anonymously. This is the site CMS's MCP surface, not a
  Scimar product MCP server: Scimar publishes no developer platform and advertises these endpoints in
  no documentation; they were found by enumerating https://scimar.ca/wp-json/.
servers:
- name: mcp-oauth-server
  transport: http
  url: https://scimar.ca/wp-json/mcp/mcp-oauth-server
  methods:
  - POST
  - GET
  - DELETE
  auth: oauth
  probe:
    request: 'JSON-RPC {"jsonrpc":"2.0","id":1,"method":"tools/list"} with Accept: application/json, text/event-stream'
    http_status: 401
    body: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    www_authenticate: >-
      Bearer realm="https://scimar.ca", resource_metadata="https://scimar.ca/.well-known/oauth-protected-resource"
    note: >-
      This is a correct RFC 9728 challenge — the 401 names the protected-resource metadata document, which
      resolves anonymously and points back at the RFC 8414 authorization-server metadata. That is a better
      OAuth discovery posture than most WordPress MCP Adapter installs, which serve neither document.
- name: mcp-adapter-default-server
  transport: http
  url: https://scimar.ca/wp-json/mcp/mcp-adapter-default-server
  methods:
  - POST
  - GET
  - DELETE
  auth: unknown
  probe:
    request: 'JSON-RPC {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
    note: >-
      Gated by the ordinary WordPress REST permission check rather than the OAuth challenge, so this
      endpoint expects a logged-in cookie + X-WP-Nonce or an Application Password.

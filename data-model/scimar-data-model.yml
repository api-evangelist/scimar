    meta, categories, tags, class_list, acf, aioseo_head, aioseo_head_json, aioseo_meta_data,
    aioseo_breadcrumb, aioseo_breadcrumb_json, aioseo_notices]
  count_observed: 46
  note: 'Scimar news stories. Sub-resources: revisions and autosaves.'
- name: Page
  rest_base: pages
  operations: [getPages, getPagesById, createPages, updatePagesById, deletePagesById]
  count_observed: 19
  note: >-
    The marketing and science surface — About, Science & Products, The Science, Product Pipeline, Team,
    Community, News, Videos, Media, Testimonials, Legal, Privacy, Accessibility, Contact, Raise History.
- name: Media
  rest_base: media
  operations: [getMedia, getMediaById, createMedia, updateMediaById, deleteMediaById, createMediaByIdEdit,
    createMediaByIdPostProcess]
  note: The attachment library — logos, brand asset archives, podcast and campaign artwork.
- name: Comment
  rest_base: comments
  operations: [getComments, getCommentsById, createComments, updateCommentsById, deleteCommentsById]
- name: Category
  rest_base: categories
  taxonomy: category
  operations: [getCategories, getCategoriesById, createCategories, updateCategoriesById, deleteCategoriesById]
- name: Tag
  rest_base: tags
  taxonomy: post_tag
  operations: [getTags, getTagsById, createTags, updateTagsById, deleteTagsById]
- name: User
  rest_base: users
  operations: [getUsers, getUsersById, getUsersMe]
  access: gated
  note: Anonymous GET /wp/v2/users 302-redirects rather than returning JSON.
- name: ApplicationPassword
  rest_base: users/{user_id}/application-passwords
  operations: [getUsersByUserIdApplicationPasswords, createUsersByUserIdApplicationPasswords,
    deleteUsersByUserIdApplicationPasswordsByUuid, getUsersByUserIdApplicationPasswordsIntrospect]
  access: gated
  note: The credential surface behind the http/basic securityScheme. Keyed by uuid, not integer id.
- name: Revision
  rest_base: posts/{parent}/revisions
  operations: [getPostsByParentRevisions, getPostsByParentRevisionsById, getPagesByParentRevisions,
    getPagesByParentRevisionsById]
  note: The reversal surface for content edits — see conventions/scimar-conventions.yml reversibility.
- name: Autosave
  rest_base: posts/{id}/autosaves
  operations: [getPostsByIdAutosaves, createPostsByIdAutosaves, getPostsByParentAutosavesById]
- name: Type
  rest_base: types
  operations: [getTypes, getTypesByType]
  note: >-
    Discovery. scimar.ca registers NO custom post types — the 11 types returned are all WordPress core
    or block-editor internals (post, page, attachment, nav_menu_item, wp_block, wp_template,
    wp_template_part, wp_global_styles, wp_navigation, wp_font_family, wp_font_face). The team and
    member-category surfaces that appear in the sitemap and llms.txt are NOT exposed through wp/v2.
- name: Status
  rest_base: statuses
  operations: [getStatuses, getStatusesByStatus]
- name: Taxonomy
  rest_base: taxonomies
  operations: [getTaxonomies, getTaxonomiesByTaxonomy]
- name: Settings
  rest_base: settings
  operations: [getSettings, updateSettings, patchSettings]
  access: gated
  note: 'Anonymous GET returns 401 rest_forbidden.'
- name: SearchResult
  rest_base: search
  operations: [getSearch]
  note: Read-only projection across posts and pages; returns id, title, url, type, subtype.

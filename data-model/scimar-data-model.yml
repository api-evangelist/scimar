api: scimar:content
note: >-
  The WordPress REST API expresses relationships as integer id fields on each resource and as HAL-style
  `_links` relations, not as JSON Schema $refs — the route args declare request shapes only, not
  response schemas. The graph below is read from those id fields and from the `_links` relations
  actually present on a live scimar.ca post. Nothing is inferred from a different WordPress site.
identifiers:
  scheme: integer
  note: >-
    Every core resource is keyed by a positive integer `id`. There are no prefixed or namespaced ids.
    Slugs (`slug`) are unique per post type and are the stable human handle used in URLs.
entities:
- name: Post
  rest_base: posts
  operations: [getPosts, getPostsById, createPosts, updatePostsById, deletePostsById]
  fields_observed: [id, date, date_gmt, guid, modified, modified_gmt, slug, status, type, link, title,

generated: '2026-08-26'
method: derived
source: >-
  Live responses observed on scimar.ca/wp-json on 2026-08-26, plus the WordPress REST error contract
  reflected in openapi/scimar-content-openapi.yml
format: wordpress-rest
rfc9457: false
envelope:
  fields:
  - {name: code, type: string, meaning: machine-readable error slug}
  - {name: message, type: string, meaning: human-readable message}
  - {name: data.status, type: integer, meaning: HTTP status code, mirrored in the response status}
  content_type: application/json
  note: >-
    Not application/problem+json — the WordPress REST API predates RFC 9457 and uses its own envelope.
    Recorded as-is; nothing normalised or invented.
problems:
- status: 401
  code: mcp_unauthorized
  title: MCP authentication required.
  meaning: >-
    The OAuth-protected MCP endpoint was called without a bearer token. Distinct from the generic
    WordPress rest_forbidden — the MCP Adapter's OAuth server emits its own code and, correctly, an
    RFC 9728 challenge.
  observed_on:
  - POST /wp-json/mcp/mcp-oauth-server (tools/list)
  observed_body: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
  observed_header: >-
    WWW-Authenticate: Bearer realm="https://scimar.ca",
    resource_metadata="https://scimar.ca/.well-known/oauth-protected-resource"
  remediation: >-
    Obtain a token from https://scimar.ca/oauth/token via authorization_code + PKCE (S256) with scope
    "mcp", per https://scimar.ca/.well-known/oauth-authorization-server.
- status: 401
  code: rest_forbidden
  title: Sorry, you are not allowed to do that.
  meaning: The request requires authentication (or higher capabilities) than the caller has.
  observed_on:
  - POST /wp-json/mcp/mcp-adapter-default-server (tools/list)
  - GET /wp-json/wp-abilities/v1/abilities
  - GET /wp-json/wp/v2/settings
  observed_body: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
  remediation: >-
    Authenticate with a WordPress Application Password (HTTP Basic) issued from
    https://scimar.ca/wp-admin/authorize-application.php, or a logged-in cookie plus X-WP-Nonce.
- status: 404
  code: rest_no_route
  title: No route was found matching the URL and request method.
  meaning: The requested path is not a registered REST route in any of the 12 namespaces.
  remediation: Enumerate valid routes from https://scimar.ca/wp-json/ before calling.
- status: 404
  code: rest_post_invalid_id
  title: Invalid post ID.
  meaning: A single-resource route was called with an id that does not exist or is not visible.
  source_operation: openapi/scimar-content-openapi.yml#getPostsById
- status: 404
  code: rest_term_invalid
  title: Term does not exist.
  meaning: A taxonomy single-resource route (categories, tags) was called with an unknown term id.
  source_operation: openapi/scimar-content-openapi.yml#getCategoriesById
- status: 400
  code: rest_invalid_param
  title: Invalid parameter(s).
  meaning: >-
    One or more query/body parameters failed the schema declared in the route args (enum,
    minimum/maximum, or type). data.params names the offending parameters.
  source_operation: openapi/scimar-content-openapi.yml#getPosts
  remediation: >-
    per_page is capped at 100 and page has minimum 1; orderby, status and context are enum-constrained.
    The constraints are carried on each operation in the derived OpenAPI.
- status: 403
  code: rest_cookie_invalid_nonce
  title: Cookie check failed.
  meaning: A cookie-authenticated write was attempted without a valid X-WP-Nonce.
- status: 401
  code: rest_cannot_view
  title: Sorry, you are not allowed to view this resource.
  meaning: >-
    Applies to the edit context and to draft/private resources; anonymous callers may only read
    published records in view or embed context.
non_json_failures:
- surface: GET /wp-json/wp/v2/users
  status: 302
  note: >-
    Anonymous listing of users does not return a JSON error — it 302-redirects. An agent that follows
    the redirect gets HTML, not an error envelope, which is a real trap on this deployment and is
    recorded here rather than smoothed over.
- surface: any unmatched non-API path (e.g. /openapi.json, /.well-known/security.txt)
  status: 404
  content_type: text/html
  note: >-
    The WordPress 404 template answers with an HTML body, not the REST error envelope. A caller must
    check Content-Type, not just the status code.
note: >-
  Scimar publishes no error reference — it publishes no developer documentation at all. The codes above
  are the WordPress REST contract as observed live on scimar.ca; the mcp_unauthorized and rest_forbidden
  entries were captured verbatim from the MCP and abilities probes. Nothing was copied from a different
  site and nothing was invented.

not_covered:
- surface: Scimar MCP servers (WordPress MCP Adapter)
  reason: >-
    tools/list is authentication-gated on both /wp-json/mcp/mcp-oauth-server (401 mcp_unauthorized,
    with an RFC 9728 challenge) and /wp-json/mcp/mcp-adapter-default-server (401 rest_forbidden),
    observed 2026-08-26, and the backing wp-abilities registry is gated too. No tool name or input
    schema is publicly observable, so no skill is written against a tool set that cannot be verified.
- surface: Write operations on wp/v2
  reason: >-
    Every create/update/delete operation requires a WordPress Application Password issued from
    https://scimar.ca/wp-admin/authorize-application.php. No third party holds one, so writes are
    deliberately out of scope. Their reversal semantics are still recorded in
    conventions/scimar-conventions.yml for anyone who does hold credentials.
- surface: SciMar NuPa Test, NuPa Renew, NuPa Daily and Hepatalin-S
  reason: >-
    Scimar's actual products — a diagnostic test meal and three therapeutic candidates — have no API,
    no endpoint and no documentation. They are described in prose on
    https://scimar.ca/science-products/product-pipeline/ only. Nothing is written against a surface
    that does not exist.
- surface: Team and Member Category
  reason: >-
    Both appear in sitemap.xml and llms.txt but neither is a registered REST route — GET /wp/v2/types
    returns no custom post type. Recorded here so a later round does not write a skill against them.

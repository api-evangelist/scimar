source: openapi/scimar-content-openapi.yml
note: >-
  Packaged Agent Skills for the only machine-readable surface Scimar exposes: the scimar.ca WordPress
  REST content API. Scimar publishes no product API, no developer portal, and no skills or AGENTS.md of
  its own (searched 2026-08-26), so these were GENERATED by the API Evangelist enrichment pipeline.
  Every operationId referenced in every skill was verified to exist verbatim in the referenced OpenAPI —
  none was invented. Each skill is read-only by design: every write operation on this API requires a
  WordPress Application Password that no third party holds.
api: scimar:content
base_url: https://scimar.ca/wp-json/wp/v2
auth: none (anonymous read; writes are gated and out of scope for these skills)
skills:
- file: scimar-read-news-and-science.md
  name: Read the Scimar news archive and science pages
  description: >-
    Page through Scimar's 46 published news stories and its 19 Science & Products and About pages as
    JSON, resolving categories, authors and featured images in a single request via _embed, and
    trimming the large All in One SEO block that this site injects into every record.
  api: openapi/scimar-content-openapi.yml
  operations: [getPosts, getPostsById, getPages, getPagesById, getCategories, getCategoriesById,
    getTags, getMedia, getMediaById]
- file: scimar-search-the-site.md
  name: Search scimar.ca and resolve results
  description: >-
    Run a cross-content-type search, resolve each lightweight result pointer into the full object by
    branching on subtype or following _links.self, and check the type/taxonomy/status registries first
    to avoid chasing sitemap sections that have no REST route.
  api: openapi/scimar-content-openapi.yml
  operations: [getSearch, getPostsById, getPagesById, getTypes, getTypesByType, getStatuses,

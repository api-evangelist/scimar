apis:
- aid: scimar:mcp
  name: Scimar MCP Server (WordPress MCP Adapter)
  description: >-
    Two Model Context Protocol endpoints advertised in the scimar.ca WordPress REST route index under
    the "mcp" namespace — /wp-json/mcp/mcp-oauth-server and /wp-json/mcp/mcp-adapter-default-server. Both
    are live and authentication-gated: an anonymous JSON-RPC tools/list returns HTTP 401, so the published
    tool set could not be enumerated. Unusually for this class of surface, the OAuth server endpoint answers
    with a WWW-Authenticate Bearer challenge naming an RFC 9728 protected-resource metadata document,
    and scimar.ca serves both /.well-known/oauth-authorization-server (RFC 8414) and /.well-known/oauth-protected-resource
    anonymously with HTTP 200.
  humanURL: https://scimar.ca/wp-json/mcp
  baseURL: https://scimar.ca/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/scimar-mcp.yml
  - type: ToolCrosswalk
    url: mcp/scimar-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/scimar-scopes.yml
  - type: WellKnown
    url: well-known/scimar-well-known.yml

apis:
- aid: scimar:content
  name: Scimar Content API (WordPress REST wp/v2)
  description: >-
    The anonymously readable WordPress REST API that serves scimar.ca content as JSON — news stories,
    Science & Products and About pages, the media library, categories, tags, taxonomies, content-type
    discovery and site-wide search. It is the CMS content API, not a Scimar product API; Scimar
    publishes no OpenAPI of its own, so the definition here was derived mechanically from the route
    discovery document served at https://scimar.ca/wp-json/ on 2026-08-26. Anonymous GET on
    /wp/v2/posts, /wp/v2/pages and /wp/v2/search returns 200; /wp/v2/settings returns 401 and
    /wp/v2/users 302-redirects. Write operations require WordPress Application Passwords.
  humanURL: https://scimar.ca/news/
  baseURL: https://scimar.ca/wp-json
  tags:
  - Content
  - CMS
  - WordPress
  properties:
  - type: OpenAPI
    url: openapi/scimar-content-openapi.yml
  - type: Overlay
    url: overlays/scimar-content-overlay.yaml
  - type: DataModel
    url: data-model/scimar-data-model.yml
  - type: ErrorCatalog
    url: errors/scimar-problem-types.yml
  - type: Conventions
    url: conventions/scimar-conventions.yml
- aid: scimar:mcp
  name: Scimar MCP Server (WordPress MCP Adapter)
  description: >-
    Two Model Context Protocol endpoints advertised in the scimar.ca WordPress REST route index under
    the "mcp" namespace — /wp-json/mcp/mcp-oauth-server and /wp-json/mcp/mcp-adapter-default-server.
    Both are live and authentication-gated: an anonymous JSON-RPC tools/list returns HTTP 401, so the
    published tool set could not be enumerated. Unusually for this class of surface, the OAuth server
    endpoint answers with a WWW-Authenticate Bearer challenge naming an RFC 9728 protected-resource
    metadata document, and scimar.ca serves both /.well-known/oauth-authorization-server (RFC 8414)
    and /.well-known/oauth-protected-resource anonymously with HTTP 200.
  humanURL: https://scimar.ca/wp-json/mcp
  baseURL: https://scimar.ca/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/scimar-mcp.yml
  - type: ToolCrosswalk
    url: mcp/scimar-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/scimar-scopes.yml
  - type: WellKnown
    url: well-known/scimar-well-known.yml

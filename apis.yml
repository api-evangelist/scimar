aid: scimar
name: Scimar
description: 'Scimar (Scimar Ltd., formerly styled SciMar) is a privately held Canadian life-sciences
  company founded in 2009 with its head office in Dauphin, Manitoba and research laboratories in
  Winnipeg. It commercializes the work of co-founder and Chief Scientific Officer Dr. W. Wayne Lautt,
  who in 1996 identified hepatalin — known in the literature as hepatic insulin-sensitizing substance,
  or HISS — a liver hormone Scimar describes as the missing link in nutrient partitioning, prediabetes
  and type 2 diabetes. Its pipeline pairs diagnostics with therapeutics: SciMar NuPa Test, a diagnostic
  test meal that measures hepatalin production and is in Phase 2 clinical trials in Canada; SciMar NuPa
  Renew, a pre-meal pharmaceutical preparing for Phase 2B; SciMar NuPa Daily, an antioxidant supplement
  intended to protect hepatalin production; and Hepatalin-S, a synthetic hepatalin for advanced-stage
  disease. Alongside the science the company runs the Wellness Transformation Network, a community
  outreach program with nonprofits, Indigenous communities and Manitoba businesses, and produces the
  Webby-nominated science podcast Inside the Breakthrough hosted by Dan Riskin. Scimar publishes no
  product or developer API and operates no developer program. The machine-readable surface on scimar.ca
  is CMS-provided: a served llms.txt generated by All in One SEO, the anonymously readable WordPress
  REST API (wp/v2) that returns news stories, pages, team profiles, media and site search as JSON, and
  a WordPress MCP Adapter that advertises two Model Context Protocol endpoints plus RFC 8414 and RFC
  9728 OAuth discovery documents — all of which are authentication-gated.'
